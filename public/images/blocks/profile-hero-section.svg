  <!-- Corner badges -->
  <rect x="170" y="12" width="28" height="28" rx="6" fill="#6366f1" opacity="0.7"/>
  <rect x="278" y="134" width="28" height="28" rx="6" fill="#c4a03c" opacity="0.6"/>
  <!-- Stats bar -->
  <line x1="16" y1="175" x2="304" y2="175" stroke="#44445a" stroke-width="1"/>
  <rect x="30" y="182" width="24" height="8" rx="1" fill="#c8c8e0"/>
  <rect x="30" y="193" width="40" height="4" rx="1" fill="#55557a"/>
  <rect x="110" y="182" width="24" height="8" rx="1" fill="#c8c8e0"/>
  <rect x="110" y="193" width="40" height="4" rx="1" fill="#55557a"/>
