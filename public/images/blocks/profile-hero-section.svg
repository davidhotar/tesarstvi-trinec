<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200" viewBox="0 0 320 200">
  <rect width="320" height="200" fill="#1e1e2e" rx="4"/>
  <!-- Left column -->
  <rect x="16" y="16" width="50" height="5" rx="1" fill="#6366f1"/>
  <rect x="16" y="28" width="120" height="12" rx="2" fill="#c8c8e0"/>
  <rect x="16" y="46" width="110" height="12" rx="2" fill="#c8c8e0"/>
